name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gateway:
    name: Gateway / TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gateway/package.json
      - name: Install dependencies
        working-directory: gateway
        run: npm install
      - name: Typecheck
        working-directory: gateway
        run: npm run typecheck
      - name: Build
        working-directory: gateway
        run: npm run build

  windows-agent:
    name: Windows agent / .NET 10
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build agent-windows/McpPc.Agent.csproj --configuration Release
